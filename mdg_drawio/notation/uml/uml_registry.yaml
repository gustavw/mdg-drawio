# UML (general) shape registry — agent-facing metadata for the uml draw.io DSL.
# Conforms to the library-agnostic shape-registry schema (shape-registry.schema.json).
# Same structure as the uml25 registry; CORE fields library-invariant, METAMODEL block
# present only where a shape maps to a UML metaclass. Pure-notation shapes (Item, Divider,
# Spacer, Title, Frame) omit the metamodel block.
#
# NOTE: the general 'uml' palette DSL uses bare function calls (Object(...), not uml.Object(...)),
# per its own 'use uml' convention; examples are kept verbatim.
# Provenance: metamodel data from the OMG UML 2.5.1 metamodel (UML.xmi). status: generated.

library: uml
version: classic
provenance:
  source_file: UML.drawio
  palette: draw.io UML (classic)
  shape_count: 65
  pages:
  - uml
grammar:
  spec: ../GRAMMAR.md
  root: UML
  notes:
  - Compartment children use Item/Divider/CompositeLabel rows.
  - "Package contains child nodes (contains: '*')."
row_types:
- name: Item
  args:
  - name: node_id
    required: true
  - name: text
    required: false
  summary: Compartment member row (field, method).
- name: Divider
  args:
  - name: node_id
    required: true
  - name: text
    required: false
  summary: Separator line between compartments.
- name: CompositeLabel
  args:
  - name: node_id
    required: true
  - name: text
    required: false
  summary: Label row of a composite shape.
