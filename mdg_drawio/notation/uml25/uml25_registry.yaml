# UML 2.5 shape registry — agent-facing metadata for the uml25 draw.io DSL.
# Conforms to the library-agnostic shape-registry schema (shape-registry.schema.json).
# CORE fields are library-invariant (present for every shape in any library).
# The METAMODEL block is library-specific and OPTIONAL: present only when a shape maps
# to a metamodel element; pure-notation shapes (tag: none) omit it entirely.
#
# Provenance: metamodel data derived from the OMG UML 2.5.1 Abstract Syntax Metamodel
# (UML.xmi). status: generated fields are machine-drafted — accept/reject per entry.

library: uml25
version: '2.5'
provenance:
  source_file: UML_2.5.drawio
  palette: draw.io UML 2.5
  shape_count: 155
  pages:
  - uml 2.5
grammar:
  spec: ../GRAMMAR.md
  root: UML25
  call: uml25.Function(node_id, "label", keyword=value, variant=N)
  edge_call: 'uml25.Function(None, None, "label", variant=N)  # source/target resolved by connection'
  positional:
  - node_id
  - label
  variant: variant=N selects which palette shape of a function family (default 1).
  nesting: A trailing colon (:) means child rows follow, indented 4 spaces under the call.
  leaf: No trailing colon means the shape has no children.
  ids: node_id and child ids (n1, c1, ...) are author-chosen and MUST be unique within the file. Placeholders
    in examples are meant to be renamed and scaled.
  args_vs_rows: Fixed template parts are passed as keyword args (keyword=, name=, body=, entry=, exit=,
    annotation=, stream=, variable=, value=, binding=, multiplicity=, heading=, condition=, node=, inv1=,
    inv2=). Repeating/scaling content goes in child rows.
  row_types:
    Item: left-aligned member/content row (default)
    Header: center-aligned compartment label
    Note: bold stub, e.g. internal-structure placeholder
    Divider: separator line; Divider(id, text, dashed=True) for a dashed one
    Lane: partialRectangle swimlane cell (Activity Partition, Lifeline)
  labels: 'Keep literal markup in labels verbatim: guillemets <<keyword>>, braces {abstract}, brackets
    [state], and \n for a line break.'
  kinds:
    vertex: a node shape; has args and/or rows
    edge: a connector; author with (None, None, ...); has endpoints, no rows
    diagram: a pre-composed fragment; buildable:false — pick real primitives instead (see related.see_also)
row_types:
- name: Item
  args:
  - name: node_id
    required: true
  - name: text
    required: false
  summary: Left-aligned member/content row (the default).
- name: Header
  args:
  - name: node_id
    required: true
  - name: text
    required: false
  summary: Center-aligned compartment label (e.g. 'attributes', 'operations').
- name: Note
  args:
  - name: node_id
    required: true
  - name: text
    required: false
  summary: Bold stub row, typically an internal-structure placeholder.
- name: Divider
  args:
  - name: node_id
    required: true
  - name: text
    required: false
  - name: dashed
    required: false
  summary: Separator line; dashed=True for a dashed one.
- name: Lane
  args:
  - name: node_id
    required: true
  - name: text
    required: false
  summary: partialRectangle swimlane cell (Activity Partition, Lifeline timing lanes).
