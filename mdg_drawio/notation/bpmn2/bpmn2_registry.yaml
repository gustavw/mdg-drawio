# BPMN 2.0 shape registry — agent-facing metadata for the bpmn2 draw.io DSL.
# Conforms to the library-agnostic shape-registry schema (shape-registry.schema.json).
# CORE fields library-invariant; METAMODEL block present only where a shape maps to a
# metamodel element. Judgment fields are status: generated — accept/reject per entry.

library: bpmn2
version: '2.0'
provenance:
  source_file: BPMN_2.0.drawio
  palette: draw.io BPMN 2.0
  shape_count: 267
  pages:
  - BPMN 2.0  General
  - BPMN 2.0  Tasks
  - BPMN 2.0  Choreographies
  - BPMN 2.0  Events
  - BPMN 2.0  Gateways
grammar:
  spec: ../GRAMMAR.md
  root: BPMN
  notes:
  - Pools and the cross-functional table use TableRowBoxPart/SwimlaneBoxPart rows.
  - 'Lanes, Group and *Expanded sub-processes contain child nodes (contains: ''*'').'
row_types:
- name: TableRowBoxPart
  args:
  - name: node_id
    required: true
  - name: text
    required: false
  summary: Cross-functional table row (actor band); nests SwimlaneBoxPart cells.
- name: SwimlaneBoxPart
  args:
  - name: node_id
    required: true
  - name: text
    required: false
  summary: Swimlane cell within a pool or table row.
