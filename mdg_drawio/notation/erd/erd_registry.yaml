# Entity Relation shape registry — agent-facing metadata for the erd draw.io DSL.
# Conforms to the library-agnostic shape-registry schema (shape-registry.schema.json).
# CORE fields library-invariant; METAMODEL block present only where a shape maps to a
# metamodel element. Judgment fields are status: generated — accept/reject per entry.

library: erd
version: '1'
provenance:
  source_file: Entity_Relation.drawio
  palette: draw.io Entity Relation
  shape_count: 50
  pages:
  - entityRelation
grammar:
  spec: ../GRAMMAR.md
  root: ERD
  notes:
  - Anchor rows may nest child Anchor rows (see the coverage file).
row_types:
- name: Row
  args:
  - name: node_id
    required: true
    passing: positional
  - name: text
    required: false
    passing: positional
  summary: Plain table row.
- name: RowKey
  args:
  - name: node_id
    required: true
    passing: positional
  - name: text
    required: false
    passing: positional
  - name: key
    required: false
    passing: keyword_only
  summary: Key row; key= sets the key tag (e.g. 'PK', 'FK1').
- name: Item
  args:
  - name: node_id
    required: true
    passing: positional
  - name: text
    required: false
    passing: positional
  summary: List item row.
- name: EntityText
  args:
  - name: node_id
    required: true
    passing: positional
  - name: text
    required: false
    passing: positional
  summary: Free-text block row inside an entity.
- name: Anchor
  args:
  - name: node_id
    required: true
    passing: positional
  - name: text
    required: false
    passing: positional
  summary: Anchor row; may nest child Anchor rows.
